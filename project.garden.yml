apiVersion: garden.io/v2
kind: Project
name: teehr-hub
defaultEnvironment: local

variables:
  smtp:
    host: smtp.gmail.com
    port: "587"
    fromDisplayName: TEEHR Hub
    replyToDisplayName: TEEHR Support
    starttls: "true"
    ssl: "false"
  # A deploy target sets this false to pause all Prefect deployments, e.g. on
  # a staging cluster.
  prefect:
    schedulesActive: "true"
  # Set per cluster by the remote deploy target (deploy-targets/).
  remoteCluster:
    contextArn: ""
    ecrRegistry: ""

environments:
  - name: local
    defaultNamespace: ${project.name}
    variables:
      aws:
        region: us-east-2
      hostname: teehr.local.app.garden
      certificateIssuerName: letsencrypt-prod
      devTeehrVersion: 32021fa67a5772ce325b6b3cbb5943ecd369587d
      stableTeehrVersion: place-holder # Needed for sync to work for some reason.
      previousTeehrVersion: place-holder
      polaris:
        inCluster: "true"
        catalogS3PathStyleAccess: "true"
        catalogS3Endpoint: "http://local-s3:9000"
        catalogS3Region: ${var.aws.region}
        catalogType: rest
        catalogUri: http://polaris:8181/api/catalog
        catalogWarehouse: s3://warehouse/
        catalogRoleArn: "" # local S3 has no real STS; Polaris can't assume a role against it
        skipCredentialSubscopingIndirection: "true"
        storageStsUnavailable: "true"
        defaultRealm: teehr
        realmsCsv: teehr
        oauthServerUri: http://keycloak-service:8080/realms/teehr/protocol/openid-connect/token
        oidcIssuerUri: http://keycloak-service:8080/realms/teehr
      trino:
        host: trino
        port: "8080"
        user: teehr
        catalog: iceberg
        schema: teehr
      # Gridded data (xpublish-api). Icechunk stores are plain zarr on S3, not
      # Iceberg tables, so they are not vended by Polaris. Locally they live in
      # the local S3 `warehouse` bucket.
      icechunk:
        bucket: "warehouse"
        prefix: "icechunk-ingests"
        accessRoleArn: "" # local S3 has no real STS; xpublish can't assume a role against it
        storageStsUnavailable: "true"
      # Vector tiles (xpublish-api). PMTiles archives sit alongside the
      # icechunk stores.
      pmtiles:
        bucket: "warehouse"
        prefix: "vector-tiles"
      allowedOrigins: "https://dashboards.${var.hostname},https://api.${var.hostname}"
      xpublish:
        # default: roles that can read anything not listed below.
        # Listed: only these roles; [] = nobody. See teehr-cloud-core/docs/icechunk-access-control.md
        accessRules:
          default: ["icechunk-read-only"]
          repos:
            authz_test_restricted: ["admin"] # for the xpublish-access-enforcement test
  - name: remote
    defaultNamespace: ${project.name}
    # Cluster-specific values (region, cluster, ECR, EFS, IRSA roles, buckets,
    # hostname) come from deploy-targets/<target>.yml, chosen with DEPLOY_TARGET.
    # It overrides anything below. See teehr-cloud-core
    # docs/platform-app-deployment-contract.md.
    varfile: deploy-targets/${local.env.DEPLOY_TARGET || "use1"}.yml
    variables:
      certificateIssuerName: letsencrypt-prod
      # Maintenance status, served outside the cluster (teehr-cloud-platform)
      statusUrl: https://status.teehr.rtiamanzi.org/status.json
      devTeehrVersion: 32021fa67a5772ce325b6b3cbb5943ecd369587d
      stableTeehrVersion: v0.7.0
      previousTeehrVersion: v0.6.6
      polaris:
        inCluster: "true"
        catalogS3PathStyleAccess: "false"
        catalogS3Endpoint: ""
        catalogS3Region: ${var.aws.region}
        catalogType: rest
        catalogUri: http://polaris:8181/api/catalog
        skipCredentialSubscopingIndirection: "false"
        storageStsUnavailable: "false"
        defaultRealm: teehr
        realmsCsv: teehr
        oauthServerUri: http://keycloak-service:8080/realms/teehr/protocol/openid-connect/token
        oidcIssuerUri: http://keycloak-service:8080/realms/teehr
      trino:
        host: trino
        port: "8080"
        user: teehr
        catalog: iceberg
        schema: teehr
      # Gridded data (xpublish-api). Separate bucket from the Iceberg
      # warehouse; accessed directly rather than through Polaris.
      # Credential vending is off unless the deploy target sets an access
      # role (deploy-targets/use1.yml).
      icechunk:
        prefix: "icechunk-ingests"
        accessRoleArn: ""
        storageStsUnavailable: "true"
      # Vector tiles (xpublish-api). PMTiles archives sit alongside the
      # icechunk stores.
      pmtiles:
        prefix: "vector-tiles"
      allowedOrigins: "https://dashboards.${var.hostname},https://api.${var.hostname}"
      xpublish:
        # default: roles that can read anything not listed below.
        # Listed: only these roles; [] = nobody. See teehr-cloud-core/docs/icechunk-access-control.md
        accessRules:
          default: ["icechunk-read-only"]
providers:
  # The name of the provider plugin to use.
  - name: local-kubernetes
    namespace: ${environment.namespace}
    environments: ["local"]
    setupIngressController: false
    deploymentRegistry:
      hostname: localhost:5001
      namespace: ${project.name}
    context: kind-kind
  - name: kubernetes
    namespace: ${environment.namespace}
    environments: ["remote"]
    imagePullSecrets:
      - name: ecr-config
        namespace: default
    deploymentRegistry:
      hostname: ${var.remoteCluster.ecrRegistry}
      namespace: ${project.name}
    context: ${var.remoteCluster.contextArn}
    buildMode: cluster-buildkit
    defaultHostname: ${var.hostname}
apiVersion: garden.io/v2
kind: Project
name: teehr-hub
defaultEnvironment: local

variables:
  smtp:
    host: smtp.gmail.com
    port: "587"
    fromDisplayName: TEEHR Hub
    replyToDisplayName: TEEHR Support
    starttls: "true"
    ssl: "false"
  aws:
    region: us-east-2
  remoteCluster:
    contextArn: arn:aws:eks:us-east-2:935462133478:cluster/teehr-hub
    ecrRegistry: 935462133478.dkr.ecr.us-east-2.amazonaws.com

environments:
  - name: local
    defaultNamespace: ${project.name}
    variables:
      hostname: teehr.local.app.garden
      certificateIssuerName: letsencrypt-prod
      devTeehrVersion: 2bd6f5c836558e3fdb5be4724c8127bf4f68d888
      stableTeehrVersion: place-holder # Needed for sync to work for some reason.
      previousTeehrVersion: place-holder
      polaris:
        inCluster: "true"
        catalogS3PathStyleAccess: "true"
        catalogS3Endpoint: "http://minio:9000"
        catalogS3Region: ${var.aws.region}
        catalogType: rest
        catalogUri: http://polaris:8181/api/catalog
        catalogWarehouse: s3://warehouse/
        catalogRoleArn: "" # MinIO has no real STS; Polaris can't assume a role against it
        skipCredentialSubscopingIndirection: "true"
        storageStsUnavailable: "true"
        defaultRealm: teehr
        realmsCsv: teehr
        oauthServerUri: http://keycloak-service:8080/realms/teehr/protocol/openid-connect/token
        oidcIssuerUri: http://keycloak-service:8080/realms/teehr
      trino:
        host: trino
        port: "8080"
        user: teehr
        catalog: iceberg
        schema: teehr
      # Gridded data (xpublish-api). Icechunk stores are plain zarr on S3, not
      # Iceberg tables, so they are not vended by Polaris. Locally they live in
      # the MinIO `warehouse` bucket.
      icechunk:
        bucket: "warehouse"
        prefix: "icechunk-ingests"
        # Comma-separated icechunk repo names. Must be non-empty — xpublish-api
        # exits at startup otherwise. Locally the service holds MinIO root
        # credentials, so it self-initializes a missing repo on first start.
        repos: "nwm30-forcing-analysis-assim"
      allowedOrigins: "https://dashboards.${var.hostname},https://api.${var.hostname}"
  - name: remote
    defaultNamespace: ${project.name}
    variables:
      hostname: teehr.rtiamanzi.org
      certificateIssuerName: letsencrypt-prod
      devTeehrVersion: 2bd6f5c836558e3fdb5be4724c8127bf4f68d888
      stableTeehrVersion: v0.6.6
      previousTeehrVersion: v0.5.3
      irsa:
        # Jupyter's role is scoped only to external, non-warehouse data
        # (e.g. ciroh-rti-hefs-data) — its Iceberg warehouse access goes
        # through Polaris-vended credentials like every other client.
        jupyterRoleArn: arn:aws:iam::935462133478:role/teehr-hub-iceberg-s3-warehouse-readonly-irsa
        # Polaris's own identity, used to assume the warehouse data-access
        # role and vend scoped, short-lived S3 credentials to Trino, Spark,
        # Prefect, and Jupyter.
        polarisRoleArn: arn:aws:iam::935462133478:role/teehr-hub-polaris-irsa
        # Prefect's role covers only non-catalog S3 work (icechunk); its
        # Iceberg access still comes from Polaris via POLARIS_USE_STS.
        prefectJobRoleArn: arn:aws:iam::935462133478:role/teehr-hub-prefect-job-irsa
        # xpublish-api reads icechunk zarr stores, which Polaris cannot vend
        # credentials for, so it holds a direct read-only role.
        xpublishRoleArn: arn:aws:iam::935462133478:role/teehr-hub-xpublish-api-irsa
      polaris:
        inCluster: "true"
        catalogS3PathStyleAccess: "false"
        catalogS3Endpoint: ""
        catalogS3Region: ${var.aws.region}
        catalogType: rest
        catalogUri: http://polaris:8181/api/catalog
        catalogWarehouse: s3://dev-teehr-iceberg-warehouse/
        catalogRoleArn: arn:aws:iam::935462133478:role/teehr-hub-iceberg-s3-warehouse-access
        skipCredentialSubscopingIndirection: "false"
        storageStsUnavailable: "false"
        defaultRealm: teehr
        realmsCsv: teehr
        oauthServerUri: http://keycloak-service:8080/realms/teehr/protocol/openid-connect/token
        oidcIssuerUri: http://keycloak-service:8080/realms/teehr
      nfsServerDns: "fs-0cb715f5b7a76e862.efs.us-east-2.amazonaws.com"
      trino:
        host: trino
        port: "8080"
        user: teehr
        catalog: iceberg
        schema: teehr
      # Gridded data (xpublish-api). Separate bucket from the Iceberg
      # warehouse; accessed directly rather than through Polaris.
      icechunk:
        bucket: "dev-teehr-icechunk-warehouse"
        prefix: "icechunk-ingests"
        # Comma-separated icechunk repo names. Must be non-empty — xpublish-api
        # exits at startup otherwise. Each repo must already exist in the
        # bucket: xpublish-api holds read-only access, so it cannot create one.
        repos: "nwm30-forcing-analysis-assim"
      allowedOrigins: "https://dashboards.${var.hostname},https://api.${var.hostname}"
providers:
  # The name of the provider plugin to use.
  - name: local-kubernetes
    namespace: ${environment.namespace}
    environments: ["local"]
    setupIngressController: false
    deploymentRegistry:
      hostname: localhost:5001
      namespace: ${project.name}
    context: kind-kind
  - name: kubernetes
    namespace: ${environment.namespace}
    environments: ["remote"]
    imagePullSecrets:
      - name: ecr-config
        namespace: default
    deploymentRegistry:
      hostname: ${var.remoteCluster.ecrRegistry}
      namespace: ${project.name}
    context: ${var.remoteCluster.contextArn}
    buildMode: cluster-buildkit
    defaultHostname: teehr.rtiamanzi.org
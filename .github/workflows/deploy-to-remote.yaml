name: Garden Deploy Remote
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cluster to deploy to (a file in deploy-targets/)
        type: choice
        options:
          - use1
          - use2
        default: use1
      force:
        description: Redeploy every action, even ones Garden thinks are current (needed after changing a deploy-target value such as hostname)
        type: boolean
        default: false
      actions:
        description: Deploy only these actions (space-separated, e.g. "keycloak keycloak-realm-config"); empty deploys everything
        type: string
        default: ""

permissions:
      id-token: write
      contents: read

jobs:
  garden-deploy-remote:
    runs-on: ubuntu-latest
    env:
      # Selects deploy-targets/<target>.yml as the remote environment's varfile.
      DEPLOY_TARGET: ${{ inputs.target }}
      TARGET_FILE: deploy-targets/${{ inputs.target }}.yml
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup app secrets
        run: |
          echo "${{ secrets.REMOTE_SECRETS }}" > teehr-cloud-core/secrets/secrets.remote.yaml

      - name: Validate deploy target
        run: |
          bash teehr-cloud-core/scripts/validate-deploy-contract.sh ${TARGET_FILE}

      - name: Set deployment env. vars
        run: |
          echo "CLUSTER_ROLE_ARN=$(yq eval '.deploy.clusterRoleArn' ${TARGET_FILE})" >> $GITHUB_ENV
          echo "ACTION_ROLE_ARN=$(yq eval '.deploy.actionRoleArn' ${TARGET_FILE})" >> $GITHUB_ENV
          echo "AWS_REGION=$(yq eval '.aws.region' ${TARGET_FILE})" >> $GITHUB_ENV
          echo "CLUSTER_NAME=$(yq eval '.deploy.clusterName' ${TARGET_FILE})" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ACTION_ROLE_ARN }}
          output-credentials: true

      - name: Sts GetCallerIdentity
        run: |
          aws sts get-caller-identity

      - name: AWS EKS Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${CLUSTER_NAME} --region ${AWS_REGION} --role-arn ${CLUSTER_ROLE_ARN}

      - name: Check platform prerequisites
        run: |
          bash teehr-cloud-core/scripts/check-platform-prereqs.sh

      - name: Deploy preview env with Garden
        uses: garden-io/garden-action@v2
        with:
          garden-version: 0.14.20
          command: deploy ${{ inputs.actions }} --force-build ${{ inputs.force && '--force' || '' }} --env remote

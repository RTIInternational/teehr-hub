# v1 flows (ADR-0019 in teehr-cloud-core), on KinD. Deployed by the v1 deployer job
# (manifests/deployer-job.yaml.tpl) from the v1 image, apart from the legacy flows.
name: teehr-hub-v1
prefect-version: 3.9.0

build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /teehr-v1

definitions:
  work_pool: &work_pool
    name: kubernetes-pool
    job_variables:
      image: "{{ $PREFECT_TEEHR_V1_IMAGE }}"
      image_pull_policy: Always
      namespace: "{{ $TEEHR_NAMESPACE }}"
      service_account_name: prefect-job
      finished_job_ttl: 300
      job_watch_timeout_seconds: 900
      pod_watch_timeout_seconds: 300
      memory_request: 1Gi
      env:
        PREFECT_LOGGING_LEVEL: INFO
        PREFECT_LOGGING_EXTRA_LOGGERS: teehr_core
        AWS_REGION: "{{ $AWS_REGION }}"
        REMOTE_CATALOG_REST_URI: "{{ $REMOTE_CATALOG_REST_URI }}"
        REMOTE_WAREHOUSE_IDENTIFIER: "{{ $REMOTE_WAREHOUSE_IDENTIFIER }}"
        REMOTE_CATALOG_S3_ENDPOINT: "{{ $REMOTE_CATALOG_S3_ENDPOINT }}"
        REMOTE_CATALOG_S3_PATH_STYLE_ACCESS: "{{ $REMOTE_CATALOG_S3_PATH_STYLE_ACCESS }}"
        POLARIS_OAUTH2_SERVER_URI: "{{ $POLARIS_OAUTH2_SERVER_URI }}"
        POLARIS_CLIENT_ID: "{{ $POLARIS_CLIENT_ID }}"
        POLARIS_DEFAULT_REALM: "{{ $POLARIS_DEFAULT_REALM }}"
      node_selector:
        teehr-hub/nodegroup-name: spark-r5-4xlarge
      tolerations:
        - key: teehr-hub/dedicated
          operator: Equal
          value: worker
          effect: NoSchedule
        - key: teehr-hub_dedicated
          operator: Equal
          value: worker
          effect: NoSchedule

  # Calls the control plane and waits (the runs themselves are its jobs): a small pod.
  work_pool_control_plane: &work_pool_control_plane
    name: kubernetes-pool
    job_variables:
      image: "{{ $PREFECT_TEEHR_V1_IMAGE }}"
      image_pull_policy: Always
      namespace: "{{ $TEEHR_NAMESPACE }}"
      service_account_name: prefect-job
      finished_job_ttl: 300
      memory_request: 256Mi
      env:
        PREFECT_LOGGING_LEVEL: INFO
        POLARIS_OAUTH2_SERVER_URI: "{{ $POLARIS_OAUTH2_SERVER_URI }}"
        POLARIS_CLIENT_ID: "{{ $POLARIS_CLIENT_ID }}"

deployments:
  - name: run-platform-evaluations
    description: Run every platform evaluation's latest version (incremental), one at a time
    entrypoint: flows/evaluations.py:run_evaluations
    parameters:
      project: platform
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool_control_plane

  - name: build-usgs-streamflow-percentiles
    description: Build public.usgs_streamflow_percentiles from public.usgs_streamflow
    entrypoint: flows/derived.py:build_derived_dataset
    parameters:
      observed: usgs_streamflow
      kind: percentiles
      # KinD holds weeks of data, not years: keep every series.
      params: {"min_years": 0}
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: build-usgs-streamflow-climatology
    description: Build public.usgs_streamflow_climatology from public.usgs_streamflow
    entrypoint: flows/derived.py:build_derived_dataset
    parameters:
      observed: usgs_streamflow
      kind: climatology
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: build-usgs-streamflow-naive-scale
    description: Build public.usgs_streamflow_naive_scale from public.usgs_streamflow
    entrypoint: flows/derived.py:build_derived_dataset
    parameters:
      observed: usgs_streamflow
      kind: naive_scale
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

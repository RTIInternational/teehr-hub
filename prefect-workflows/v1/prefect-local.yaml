# v1 flows (ADR-0019 in teehr-cloud-core), on KinD. Deployed by the v1 deployer job
# (manifests/deployer-job.yaml.tpl) from the v1 image, apart from the legacy flows.
name: teehr-hub-v1
prefect-version: 3.9.0

build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /teehr-v1

definitions:
  work_pool: &work_pool
    name: kubernetes-pool
    job_variables:
      image: "{{ $PREFECT_TEEHR_V1_IMAGE }}"
      image_pull_policy: Always
      namespace: "{{ $TEEHR_NAMESPACE }}"
      service_account_name: prefect-job
      finished_job_ttl: 300
      job_watch_timeout_seconds: 900
      pod_watch_timeout_seconds: 300
      memory_request: 1Gi
      env:
        PREFECT_LOGGING_LEVEL: INFO
        PREFECT_LOGGING_EXTRA_LOGGERS: teehr_core
        AWS_REGION: "{{ $AWS_REGION }}"
        REMOTE_CATALOG_REST_URI: "{{ $REMOTE_CATALOG_REST_URI }}"
        REMOTE_WAREHOUSE_IDENTIFIER: "{{ $REMOTE_WAREHOUSE_IDENTIFIER }}"
        REMOTE_CATALOG_S3_ENDPOINT: "{{ $REMOTE_CATALOG_S3_ENDPOINT }}"
        REMOTE_CATALOG_S3_PATH_STYLE_ACCESS: "{{ $REMOTE_CATALOG_S3_PATH_STYLE_ACCESS }}"
        POLARIS_OAUTH2_SERVER_URI: "{{ $POLARIS_OAUTH2_SERVER_URI }}"
        POLARIS_CLIENT_ID: "{{ $POLARIS_CLIENT_ID }}"
        POLARIS_DEFAULT_REALM: "{{ $POLARIS_DEFAULT_REALM }}"
      node_selector:
        teehr-hub/nodegroup-name: spark-r5-4xlarge
      tolerations:
        - key: teehr-hub/dedicated
          operator: Equal
          value: worker
          effect: NoSchedule
        - key: teehr-hub_dedicated
          operator: Equal
          value: worker
          effect: NoSchedule

  # Calls the control plane and waits (the runs themselves are its jobs): a small pod.
  work_pool_control_plane: &work_pool_control_plane
    name: kubernetes-pool
    job_variables:
      image: "{{ $PREFECT_TEEHR_V1_IMAGE }}"
      image_pull_policy: Always
      namespace: "{{ $TEEHR_NAMESPACE }}"
      service_account_name: prefect-job
      finished_job_ttl: 300
      memory_request: 256Mi
      env:
        PREFECT_LOGGING_LEVEL: INFO
        POLARIS_OAUTH2_SERVER_URI: "{{ $POLARIS_OAUTH2_SERVER_URI }}"
        POLARIS_CLIENT_ID: "{{ $POLARIS_CLIENT_ID }}"

deployments:
  - name: v1-run-platform-evaluations
    description: Run every platform evaluation's latest version (incremental), one at a time
    entrypoint: flows/evaluations.py:run_evaluations
    parameters:
      project: platform
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool_control_plane

  - name: v1-build-usgs-streamflow-percentiles
    description: Build public.usgs_inst_streamflow_percentiles from public.usgs_inst_streamflow
    entrypoint: flows/derived.py:build_derived_dataset
    parameters:
      observed: usgs_inst_streamflow
      kind: percentiles
      # KinD holds weeks of data, not years: keep every series.
      params: {"min_years": 0}
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: v1-build-usgs-streamflow-climatology
    description: Build public.usgs_inst_streamflow_climatology from public.usgs_inst_streamflow
    entrypoint: flows/derived.py:build_derived_dataset
    parameters:
      observed: usgs_inst_streamflow
      kind: climatology
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: v1-build-usgs-streamflow-naive-scale
    description: Build public.usgs_inst_streamflow_naive_scale from public.usgs_inst_streamflow
    entrypoint: flows/derived.py:build_derived_dataset
    parameters:
      observed: usgs_inst_streamflow
      kind: naive_scale
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: v1-ingest-usgs-streamflow
    description: Ingest USGS streamflow (the last day) into public.usgs_inst_streamflow, for the active gages of its layer with instantaneous discharge
    entrypoint: flows/ingest_usgs.py:ingest_usgs_streamflow
    parameters:
      dataset: usgs_inst_streamflow
      where: is_active == True and has_inst_discharge == True
      lookback_days: 1
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: v1-backfill-usgs-streamflow
    description: Fill public.usgs_inst_streamflow's whole record from the USGS bulk Parquet files, then top up from the API (by hand; replaces the months it writes)
    entrypoint: flows/ingest_usgs.py:backfill_usgs_streamflow
    parameters:
      dataset: usgs_inst_streamflow
      where: has_inst_discharge == True
      workers: 1  # ~1 GB per site being read
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: v1-ingest-usgs-daily-streamflow
    description: Ingest USGS daily mean streamflow (the last week) into public.usgs_daily_streamflow
    entrypoint: flows/ingest_usgs.py:ingest_usgs_streamflow
    parameters:
      dataset: usgs_daily_streamflow
      service: dv
      lookback_days: 7
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  # RFC forecasts: the gauges in usgs_nwpsrfc (register it and the dataset with
  # warehouse/remote/06_v1_copy/11_nwpsrfc.ipynb). Run by hand.
  - name: v1-ingest-nwps-rfc-streamflow
    description: Ingest the RFC streamflow forecasts (NWPS) newer than each gauge's latest into public.nwpsrfc_streamflow_forecast
    entrypoint: flows/ingest_nwps.py:ingest_nwps_rfc_streamflow
    parameters:
      dataset: nwpsrfc_streamflow_forecast
      where: "True"
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  # NWM: the seeded short range and medium range datasets, for the seed's three gages (its
  # layer has no state_name: every gage). Run by hand with start/end around the seed's days.
  - name: v1-ingest-nwm-short-range
    description: Ingest NWM short_range streamflow into public.nwm31_short_range
    entrypoint: flows/ingest_nwm.py:ingest_nwm_streamflow
    parameters:
      configuration: short_range
      dataset: nwm31_short_range
      where: "True"
      workers: 4  # the local pool's 1 GiB
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

  - name: v1-ingest-nwm-medium-range-mem1
    # Into nwm31_medium_range (with its member column), as on use1: register it with
    # warehouse/remote/06_v1_copy/06_nwm_points.ipynb (the seed's nwm31_medium_range_mem1 has none).
    description: Ingest NWM medium_range_mem1 streamflow into public.nwm31_medium_range
    entrypoint: flows/ingest_nwm.py:ingest_nwm_streamflow
    parameters:
      configuration: medium_range_mem1
      where: "True"
      workers: 4  # the local pool's 1 GiB
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *work_pool

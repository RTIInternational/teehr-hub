  # Gridded Mean Areal Values
  # The mapper is overridden because ingest stores the grid under its standardized
  # name and units (rainrate_hourly_mean, mm/s).
  - name: calculate-nwm31-forcing-analysis-assim-grids-pixel-coverage-weights
    version:
    tags: []
    description: >-
      Calculate usgsbasin pixel coverage weights for the NWM 3.1 CONUS forcing grid. The rows
      include position_index, so they also serve the Sedona MAP flow. Run on demand; write_mode
      "overwrite" replaces the whole table, including other domains.
    entrypoint: workflows/ingests/pixel_coverage_weights.py:calculate_pixel_coverage_weights
    parameters: {
      "args": {
        "temp_dir_path": *temp_dir_path,
        "configuration_name": "nwm31-forcing-analysis-assim",
        "location_id_prefix": "usgsbasin",
        "grid_variable_name": "rainrate_hourly_mean",
        "domain_name": "nwm30_conus_forcing",
        "write_mode": "append",
        "variable_and_unit_mapper": {
          "variable_name": {"rainrate_hourly_mean": {"name": "rainrate_hourly_mean", "long_name": "Hourly Mean Rainfall Rate"}},
          "unit_name": {"mm/s": {"name": "mm/s", "long_name": "Millimeters per Second"}}
        }
      }
    }
    work_pool: *work_pool

  - name: calculate-nwm31-forcing-analysis-assim-grids-mean-areal-values
    version:
    tags: []
    description: >-
      Calculate usgsbasin mean areal RAINRATE from the NWM 3.1 forcing IceChunk repository.
      Processes every timestep in the repository and appends, so reruns duplicate values.
    entrypoint: workflows/ingests/mean_areal_values.py:calculate_mean_areal_values
    parameters: {

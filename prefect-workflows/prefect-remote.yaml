  # Gridded Data Ingests (IceChunk)
  - name: ingest-nwm31-forcing-analysis-assim-grids
    version:
    tags: []
    concurrency_limit: 1
    concurrency_options:
      collision_strategy: "CANCEL_NEW"
    description: >-
      Ingest NWM 3.1 forcing analysis/assimilation RAINRATE grids (CONUS) into an IceChunk S3
      repository using VirtualiZarr, then build pyramids. Keep num_lookback_days set; resuming
      from the store (null) steps forward a full day and would skip hours.
    entrypoint: workflows/ingests/ingest_gridded_data.py:ingest_gridded_data
    parameters: {
      "args": {
        "configuration_name": "nwm31-forcing-analysis-assim",
        "source_data_storage": "gcs",
        "parser_type": "hdf",
        "variable_names": ["RAINRATE"],
        "num_lookback_days": 1,
        "x_dim": "x",
        "y_dim": "y",
        "source_crs": "+proj=lcc +lat_0=40 +lon_0=-97 +lat_1=30 +lat_2=60 +x_0=0 +y_0=0 +R=6370000 +units=m +no_defs",
        "factors": [1, 2, 4],
        "pyramid_encoding": {"rainrate_hourly_mean": {"dtype": "uint16", "scale_factor": 2.0e-6, "_FillValue": 65535}},
        "obstore_kwargs": {"skip_signature": true},
        "xconcat_kwargs": {
          "coords": "minimal",
          "data_vars": "minimal",
          "compat": "override",
          "join": "override",
          "combine_attrs": "override"
        }
      }
    }
    work_pool: *work_pool_large
    schedule:
      cron: "40 */6 * * *"
      active: false


# glibc's default address order (RFC 6724), except that private IPv6 (fc00::/7,
# which holds the pods' fd00:: addresses) gets the same label as public IPv6.
# Without this, glibc puts IPv4 first for pods, so traffic to sources with IPv6
# (GCS, PyPI) goes through the NAT gateway instead of the free IPv6 egress
# (teehr-cloud-platform #36). IPv4-only hosts still use IPv4.
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label fc00::/7      1
label 2001:0::/32   7
